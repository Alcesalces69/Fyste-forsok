name: Publish next social post

on:
  schedule:
    # GitHub delays scheduled runs by several hours (observed 1-5 h, once 14 h),
    # so the cron fires early on purpose and the "wait" job sleeps until
    # 08:00 UTC (10:00 CEST / 09:00 CET). Off-peak minute on purpose.
    - cron: "17 2 * * 2,5,0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate only, publish nothing)"
        type: boolean
        default: false
      force:
        description: "Publish even if a post already went out today (UTC)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  wait:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until 08:00 UTC
        run: |
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) 08:00:00" +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target - now))s until 08:00 UTC"
            sleep $((target - now))
          else
            echo "Already past 08:00 UTC - publishing immediately"
          fi

  publish:
    needs: wait
    if: ${{ !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Publish next post in queue
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 scripts/publish.py

      - name: Commit queue -> posted move
        run: |
          git config user.name "wildr-social-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Published post $(date -u +%F)"
          git push
